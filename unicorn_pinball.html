<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🦄 Unicorn Pinball 🌈</title>
<style>
  html,body{margin:0;height:100%;background:#050510;display:flex;align-items:center;justify-content:center;font-family:sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{image-rendering:auto;height:min(100vh,calc(100vw*3/2));width:auto;aspect-ratio:2/3;box-shadow:0 0 120px #ff40a066;touch-action:none;display:block;border-radius:10px}
</style>
</head>
<body>
<canvas id="c" width="400" height="600"></canvas>
<script type="module">
  import('https://esm.sh/@wvdsh/sdk-js').then(({ default: Wavedash }) => {
    Wavedash.updateLoadProgressZeroToOne(1);
    Wavedash.init();
  });
</script>
<script>
(function(){
  const c = document.getElementById('c');
  const g = c.getContext('2d');
  const W = 400, H = 600;
  const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

  // ============================================================
  // AUDIO (unchanged)
  // ============================================================
  let actx = null, musicGain = null, noiseBuffer = null;
  let musicNext = 0, musicStep = 0, musicOn = false, musicIntensity = 0;

  const NOTES = {
    'C2':65.41,'G2':98.00,'A2':110.00,'F2':87.31,'D2':73.42,'E2':82.41,
    'C3':130.81,'D3':146.83,'E3':164.81,'F3':174.61,'G3':196.00,'A3':220.00,
    'C4':261.63,'D4':293.66,'E4':329.63,'F4':349.23,'G4':392.00,'A4':440.00,'B4':493.88,
    'C5':523.25,'D5':587.33,'E5':659.25,'F5':698.46,'G5':783.99,'A5':880.00,
    'C6':1046.50,'E6':1318.51,'G6':1567.98,
  };
  const LEAD = [
    'C5','E5','G5','C6','G5','E5','G5','C6','C5','E5','G5','C6','G5','E5','C5','E5',
    'A4','C5','E5','A5','E5','C5','A4','C5','A4','C5','E5','A5','E5','C5','A4','E5',
    'F4','A4','C5','F5','C5','A4','F4','A4','F4','A4','C5','F5','A5','F5','C5','A4',
    'G4','B4','D5','G5','D5','B4','G4','B4','G4','B4','D5','G5','B5','G5','D5','B4',
  ];
  const BASS = [
    'C2','R','R','G2','C2','R','R','G2','C2','R','R','G2','C2','R','G2','C2',
    'A2','R','R','E2','A2','R','R','E2','A2','R','R','E2','A2','R','E2','A2',
    'F2','R','R','C3','F2','R','R','C3','F2','R','R','C3','F2','R','C3','F2',
    'G2','R','R','D3','G2','R','R','D3','G2','R','R','D3','G2','R','D3','G2',
  ];
  const DRUMS = [
    'K','.','H','.','S','.','H','H','K','.','H','.','S','.','H','.',
    'K','.','H','.','S','.','H','H','K','.','H','.','S','.','H','.',
    'K','.','H','.','S','.','H','H','K','.','H','.','S','.','H','.',
    'K','.','H','.','S','.','H','H','K','K','H','.','S','S','H','S',
  ];
  const BPM = 150, STEP_DUR = 60 / BPM / 4;

  function initAudio(){
    if (actx) return;
    try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return; }
    if (actx.state === 'suspended') actx.resume();
    musicGain = actx.createGain(); musicGain.gain.value = 0.0001; musicGain.connect(actx.destination);
    musicGain.gain.exponentialRampToValueAtTime(0.24, actx.currentTime + 1.5);
    const n = actx.sampleRate * 0.12; noiseBuffer = actx.createBuffer(1, n, actx.sampleRate);
    const d = noiseBuffer.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    musicNext = actx.currentTime + 0.08; musicStep = 0; musicOn = true; setInterval(scheduleMusic, 25);
  }
  function scheduleMusic(){ if (!musicOn || !actx) return; while (musicNext < actx.currentTime + 0.15){ playStep(musicStep, musicNext); musicNext += STEP_DUR; musicStep = (musicStep + 1) % 64; } }
  function playStep(i, t){ const I = musicIntensity; const lead = LEAD[i]; if (lead && lead !== 'R') tone(NOTES[lead], t, STEP_DUR*1.05, 'square', 0.032 + I*0.02); const bass = BASS[i]; if (bass && bass !== 'R') tone(NOTES[bass], t, STEP_DUR*2.4, 'triangle', 0.075 + I*0.03); if (I > 0.4 && lead && lead !== 'R') tone(NOTES[lead]*2, t + STEP_DUR*0.5, STEP_DUR*0.6, 'sawtooth', (I-0.4)*0.11); const d = DRUMS[i]; if (d === 'K') kick(t, 0.14 + I*0.04); else if (d === 'S') snare(t); else if (d === 'H') hat(t, 0.015 + I*0.018); }
  function tone(f, t, dur, type, vol){ const o = actx.createOscillator(), gn = actx.createGain(); o.type = type; o.frequency.value = f; gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.006); gn.gain.setValueAtTime(vol, t + dur*0.45); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(gn); gn.connect(musicGain); o.start(t); o.stop(t + dur + 0.02); }
  function kick(t, vol){ const o = actx.createOscillator(), gn = actx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.09); gn.gain.setValueAtTime(vol || 0.15, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.16); o.connect(gn); gn.connect(musicGain); o.start(t); o.stop(t + 0.18); }
  function snare(t){ const s = actx.createBufferSource(); s.buffer = noiseBuffer; const f = actx.createBiquadFilter(); f.type='highpass'; f.frequency.value=1400; const gn = actx.createGain(); gn.gain.setValueAtTime(0.05, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.09); s.connect(f); f.connect(gn); gn.connect(musicGain); s.start(t); s.stop(t + 0.1); }
  function hat(t, vol){ const s = actx.createBufferSource(); s.buffer = noiseBuffer; const f = actx.createBiquadFilter(); f.type='highpass'; f.frequency.value=7000; const gn = actx.createGain(); gn.gain.setValueAtTime(vol || 0.015, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.03); s.connect(f); f.connect(gn); gn.connect(musicGain); s.start(t); s.stop(t + 0.05); }
  function beep(freq, dur, type, vol, freq2, delay){ if (!actx) return; const t0 = actx.currentTime + (delay || 0); const o = actx.createOscillator(), gn = actx.createGain(); o.type = type || 'square'; o.frequency.setValueAtTime(freq, t0); if (freq2) o.frequency.exponentialRampToValueAtTime(freq2, t0 + dur); gn.gain.setValueAtTime(vol === undefined ? 0.05 : vol, t0); gn.gain.exponentialRampToValueAtTime(0.001, t0 + dur); o.connect(gn); gn.connect(actx.destination); o.start(t0); o.stop(t0 + dur); }
  const sfx = {
    flipper:  () => beep(500, 0.035, 'square', 0.05, 700),
    launch:   () => beep(300, 0.1, 'sine', 0.09, 900),
    bumperHi: () => { beep(880, 0.06, 'square', 0.08, 1320); beep(1760, 0.08, 'triangle', 0.05, null, 0.03); },
    bumperMd: () => beep(660, 0.05, 'square', 0.07, 990),
    bumperLo: () => beep(440, 0.05, 'square', 0.06, 660),
    drain:    () => { beep(300, 0.3, 'sawtooth', 0.09, 100); beep(200, 0.4, 'sine', 0.08, 80, 0.1); },
    gameover: () => { [523,440,349,262].forEach((n,i) => beep(n, 0.25, 'triangle', 0.08, null, i*130)); },
    win:      () => { [523,659,784,1046,1318].forEach((n,i) => beep(n, 0.15, 'triangle', 0.09, null, i*70)); },
    gift:     () => { [400,600,800,1000].forEach((n,i) => beep(n, 0.1, 'triangle', 0.07, null, i*60)); },
    select:   () => beep(700, 0.06, 'square', 0.05),
  };

  // ============================================================
  // PHYSICS CONSTANTS
  // ============================================================
  const PHYS_HZ = 120, PHYS_DT = 1 / PHYS_HZ, MAX_ACCUM = 0.10, MAX_SUBSTEP_DIST = 3;
  const GRAVITY = 900, AIR_DRAG = 0.9985, MAX_SPEED = 1400;
  const REST_WALL = 0.52, REST_BUMPER = 0.72, REST_FLIPPER = 0.30, FRICTION_GROUND = 0.985;
  const BALL_R = 9, DREN_Y = 590;
  const TOP_Y = 80, WALL_L_X = 15, WALL_R_X = 385;

  // ============================================================
  // BUMPERS — 10 obstacles
  // ============================================================
  const BUMPERS = [
    { x: 200, y: 165, r: 34, emoji: '🦄', points: 500, color: '#ff3a8c', glow:'#ffd700' },
    { x: 110, y: 250, r: 22, emoji: '🌈', points: 100, color: '#4ad8ff', glow:'#a0f0ff' },
    { x: 290, y: 250, r: 22, emoji: '🌈', points: 100, color: '#4ad8ff', glow:'#a0f0ff' },
    { x: 200, y: 100, r: 20, emoji: '⭐', points: 200, color: '#ffd040', glow:'#fff0a0' },
    { x: 80,  y: 380, r: 18, emoji: '🍀', points: 75,  color: '#48e070', glow:'#a0ffb0' },
    { x: 320, y: 380, r: 18, emoji: '🍀', points: 75,  color: '#48e070', glow:'#a0ffb0' },
    { x: 200, y: 340, r: 16, emoji: '💎', points: 300, color: '#a060ff', glow:'#d0b0ff' },
    { x: 60,  y: 150, r: 14, emoji: '🐸', points: 50,  color: '#70d040', glow:'#c0ffa0' },
    { x: 340, y: 150, r: 14, emoji: '🔥', points: 120, color: '#ff6020', glow:'#ffb080' },
    { x: 200, y: 260, r: 12, emoji: '🎯', points: 250, color: '#ff2050', glow:'#ff8090' },
  ];

  // Extra walls / posts between bumpers (small circular posts)
  const POSTS = [
    { x: 140, y: 200, r: 6 },
    { x: 260, y: 200, r: 6 },
    { x: 140, y: 300, r: 6 },
    { x: 260, y: 300, r: 6 },
  ];

  const WALLS = [
    { x1: WALL_L_X, y1: TOP_Y, x2: WALL_L_X, y2: 520 },
    { x1: WALL_R_X, y1: TOP_Y, x2: WALL_R_X, y2: 520 },
    { x1: WALL_L_X, y1: 520, x2: 138, y2: 540 },
    { x1: WALL_R_X, y1: 520, x2: 262, y2: 540 },
  ];

  const flipperL = { px: 138, py: 540, len: 50, w: 11, restAngle: 0.30, activeAngle: -0.55, angle: 0.30, angVel: 0, pressed: false };
  const flipperR = { px: 262, py: 540, len: 50, w: 11, restAngle: Math.PI - 0.30, activeAngle: Math.PI + 0.55, angle: Math.PI - 0.30, angVel: 0, pressed: false };
  const FLIP_SPEED_ACTIVE = 32, FLIP_SPEED_RELEASE = 14;

  const ball = { x: 330, y: 140, vx: 0, vy: 0, alive: false, restTime: 0 };

  // ============================================================
  // GAME STATE
  // ============================================================
  let mode = 'menu', credits = 100, score = 0, ballsLeft = 3;
  let best = 0, combo = 1, comboTimer = 0, freeGiftGiven = false;
  let trail = [], particles = [], popups = [];
  let shake = 0, flash = 0, frame = 0, accum = 0, lastFrame = performance.now();

  const LS = 'js13k_2026_unicornpinball_';
  try { credits = parseInt(localStorage.getItem(LS+'credits') || '100', 10); best = parseInt(localStorage.getItem(LS+'best') || '0', 10); if (isNaN(credits)) credits = 100; if (isNaN(best)) best = 0; } catch(e){}
  function save(){ try { localStorage.setItem(LS+'credits', credits); localStorage.setItem(LS+'best', best); } catch(e){} }

  // ============================================================
  // UTIL
  // ============================================================
  function emoji(str, x, y, size, flip){ g.save(); g.translate(x, y); if (flip) g.scale(-1, 1); g.font = size + 'px ' + EMOJI; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(str, 0, 0); g.restore(); }
  function txt(str, x, y, size, color, align){ g.font = 'bold ' + size + 'px sans-serif'; g.textAlign = align || 'left'; g.textBaseline = 'middle'; g.fillStyle = 'rgba(0,0,0,0.7)'; g.fillText(str, x + 1.5, y + 1.5); g.fillStyle = color; g.fillText(str, x, y); }
  function roundRect(x, y, w, h, r){ g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.arcTo(x + w, y, x + w, y + r, r); g.lineTo(x + w, y + h - r); g.arcTo(x + w, y + h, x + w - r, y + h, r); g.lineTo(x + r, y + h); g.arcTo(x, y + h, x, y + h - r, r); g.lineTo(x, y + r); g.arcTo(x, y, x + r, y, r); g.closePath(); }
  function showPopup(x, y, text, color, size, life){ popups.push({ x, y, text, color, size: size||14, life: life||60, vy: -60 }); }
  function spawnParticles(x, y, color, n, speed, size){ for (let i = 0; i < n; i++){ const a = Math.random() * Math.PI * 2; const s = speed * (0.4 + Math.random() * 0.6); particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 25 + Math.random() * 25, color, size: size || 2 + Math.random() * 2 }); } }

  // ============================================================
  // PHYSICS
  // ============================================================
  function closestPointOnSegment(px, py, ax, ay, bx, by){ const abx = bx - ax, aby = by - ay; const denom = abx*abx + aby*aby; let t = denom > 0 ? ((px-ax)*abx + (py-ay)*aby) / denom : 0; t = Math.max(0, Math.min(1, t)); return { x: ax + abx*t, y: ay + aby*t }; }
  function collideCircle(cx, cy, cr, restitution, impulseBase, onHit){ const dx = ball.x - cx; const dy = ball.y - cy; const minDist = BALL_R + cr; const d2 = dx*dx + dy*dy; if (d2 >= minDist * minDist) return false; const d = Math.sqrt(d2) || 0.001; const nx = dx / d, ny = dy / d; ball.x = cx + nx * minDist; ball.y = cy + ny * minDist; const vn = ball.vx * nx + ball.vy * ny; if (vn < 0){ ball.vx -= (1 + restitution) * vn * nx; ball.vy -= (1 + restitution) * vn * ny; if (impulseBase > 0){ ball.vx += nx * impulseBase; ball.vy += ny * impulseBase; } const tx = -ny, ty = nx; const vt = ball.vx * tx + ball.vy * ty; ball.vx -= vt * (1 - FRICTION_GROUND) * tx; ball.vy -= vt * (1 - FRICTION_GROUND) * ty; } if (onHit) onHit(); return true; }
  function collideSegment(w){ const cp = closestPointOnSegment(ball.x, ball.y, w.x1, w.y1, w.x2, w.y2); const dx = ball.x - cp.x, dy = ball.y - cp.y; const d2 = dx*dx + dy*dy; if (d2 >= BALL_R * BALL_R) return; const d = Math.sqrt(d2) || 0.001; const nx = dx / d, ny = dy / d; ball.x = cp.x + nx * BALL_R; ball.y = cp.y + ny * BALL_R; const vn = ball.vx * nx + ball.vy * ny; if (vn < 0){ ball.vx -= (1 + REST_WALL) * vn * nx; ball.vy -= (1 + REST_WALL) * vn * ny; const tx = -ny, ty = nx; const vt = ball.vx * tx + ball.vy * ty; ball.vx -= vt * (1 - FRICTION_GROUND) * tx; ball.vy -= vt * (1 - FRICTION_GROUND) * ty; } }
  function collideFlipper(f){ const tipX = f.px + Math.cos(f.angle) * f.len; const tipY = f.py + Math.sin(f.angle) * f.len; const cp = closestPointOnSegment(ball.x, ball.y, f.px, f.py, tipX, tipY); const dx = ball.x - cp.x, dy = ball.y - cp.y; const minDist = BALL_R + f.w / 2; const d2 = dx*dx + dy*dy; if (d2 >= minDist * minDist) return; const d = Math.sqrt(d2) || 0.001; const nx = dx / d, ny = dy / d; ball.x = cp.x + nx * minDist; ball.y = cp.y + ny * minDist; const rx = cp.x - f.px, ry = cp.y - f.py; const cvx = -f.angVel * ry, cvy = f.angVel * rx; const relVx = ball.vx - cvx, relVy = ball.vy - cvy; const relVn = relVx * nx + relVy * ny; if (relVn < 0){ ball.vx -= (1 + REST_FLIPPER) * relVn * nx; ball.vy -= (1 + REST_FLIPPER) * relVn * ny; const tx = -ny, ty = nx; const relVt = relVx * tx + relVy * ty; ball.vx -= relVt * 0.05 * tx; ball.vy -= relVt * 0.05 * ty; const angSpeed = Math.abs(f.angVel); if (angSpeed > 5) shake = Math.max(shake, Math.min(6, angSpeed * 0.15)); } }
  function physicsStep(dt){ if (!ball.alive || mode !== 'playing') return; ball.vy += GRAVITY * dt; const drag = Math.pow(AIR_DRAG, dt * 60); ball.vx *= drag; ball.vy *= drag; const sp = Math.hypot(ball.vx, ball.vy); if (sp > MAX_SPEED){ ball.vx = ball.vx / sp * MAX_SPEED; ball.vy = ball.vy / sp * MAX_SPEED; } const speed = Math.hypot(ball.vx, ball.vy); const subSteps = Math.max(1, Math.ceil(speed * dt / MAX_SUBSTEP_DIST)); const subDt = dt / subSteps; for (let i = 0; i < subSteps; i++){ ball.x += ball.vx * subDt; ball.y += ball.vy * subDt; checkBumpersCollision(); checkWallsCollision(); checkTopCollision(); checkFlippersCollision(); } const speedNow = Math.hypot(ball.vx, ball.vy); if (speedNow < 15){ ball.restTime += dt; if (ball.restTime > 2.0){ ball.vx += (Math.random() - 0.5) * 400; ball.vy -= 150; ball.restTime = 0; } } else ball.restTime = 0; trail.push({ x: ball.x, y: ball.y, hue: (frame*4) % 360, life: 22 }); if (trail.length > 40) trail.shift(); if (ball.y > DREN_Y) loseBall(); }
  function checkBumpersCollision(){ for (const b of BUMPERS){ const impulse = 260 + b.r * 2; collideCircle(b.x, b.y, b.r, REST_BUMPER, impulse, () => { const pts = b.points * combo; score += pts; combo = Math.min(combo + 1, 8); comboTimer = 120; showPopup(b.x, b.y - 8, '+' + pts, b.glow, 13, 45); spawnParticles(b.x, b.y, b.color, 14, 300, 3); shake = Math.max(shake, 5); if (b.points >= 500) sfx.bumperHi(); else if (b.points >= 100) sfx.bumperMd(); else sfx.bumperLo(); }); } }
  function checkWallsCollision(){ for (const w of WALLS) collideSegment(w); for (const p of POSTS){ const dx = ball.x - p.x, dy = ball.y - p.y; const minDist = BALL_R + p.r; const d2 = dx*dx + dy*dy; if (d2 < minDist*minDist && d2 > 0.001){ const d = Math.sqrt(d2); const nx = dx/d, ny = dy/d; ball.x = p.x + nx*minDist; ball.y = p.y + ny*minDist; const vn = ball.vx*nx + ball.vy*ny; if (vn < 0){ ball.vx -= (1 + REST_WALL) * vn * nx; ball.vy -= (1 + REST_WALL) * vn * ny; } } } }
  function checkTopCollision(){ if (ball.y - BALL_R < TOP_Y){ ball.y = TOP_Y + BALL_R; if (ball.vy < 0) ball.vy = -ball.vy * REST_WALL; } const corners = [ {x: WALL_L_X, y: TOP_Y}, {x: WALL_R_X, y: TOP_Y} ]; for (const cn of corners){ const dx = ball.x - cn.x, dy = ball.y - cn.y; const minDist = BALL_R + 8; const d2 = dx*dx + dy*dy; if (d2 < minDist*minDist && d2 > 0.001){ const d = Math.sqrt(d2); const nx = dx / d, ny = dy / d; ball.x = cn.x + nx * minDist; ball.y = cn.y + ny * minDist; const vn = ball.vx * nx + ball.vy * ny; if (vn < 0){ ball.vx -= (1 + REST_WALL) * vn * nx; ball.vy -= (1 + REST_WALL) * vn * ny; } } } }
  function checkFlippersCollision(){ collideFlipper(flipperL); collideFlipper(flipperR); }
  function updateFlipper(f, dt){ const target = f.pressed ? f.activeAngle : f.restAngle; const speed = f.pressed ? FLIP_SPEED_ACTIVE : FLIP_SPEED_RELEASE; const prev = f.angle; if (f.angle < target) f.angle = Math.min(target, f.angle + speed * dt); else if (f.angle > target) f.angle = Math.max(target, f.angle - speed * dt); f.angVel = (f.angle - prev) / dt; }

  // ============================================================
  // GAME FLOW
  // ============================================================
  function newGame(){ if (credits < 10){ showPopup(W/2, H/2, 'NO CREDITS', '#ff6060', 16, 60); if (!freeGiftGiven){ credits += 50; freeGiftGiven = true; sfx.gift(); setTimeout(() => showPopup(W/2, H/2 + 30, '+50 HOUSE GIFT', '#ffd700', 14, 80), 400); } return; } credits -= 10; save(); score = 0; ballsLeft = 3; combo = 1; comboTimer = 0; mode = 'playing'; sfx.select(); accum = 0; startBall(); }
  function startBall(){ if (ballsLeft <= 0){ endGame(); return; } ball.x = 330; ball.y = 140; ball.vx = -180; ball.vy = -80; ball.alive = true; ball.restTime = 0; trail = []; sfx.launch(); spawnParticles(ball.x, ball.y, '#ffffff', 12, 200, 2); showPopup(W/2, 90, 'BALL ' + (4 - ballsLeft) + '/3', '#ffd700', 14, 60); }
  function loseBall(){ ball.alive = false; ballsLeft--; sfx.drain(); shake = 10; combo = 1; comboTimer = 0; showPopup(W/2, H/2 - 40, 'BALL LOST', '#ff6060', 22, 80); if (ballsLeft <= 0){ setTimeout(endGame, 700); } else { setTimeout(startBall, 700); } }
  function endGame(){ mode = 'gameover'; const earned = Math.floor(score / 1000); credits += earned; if (score > best) best = score; save(); sfx.gameover(); setTimeout(() => sfx.win(), 600); }
  function backToMenu(){ mode = 'menu'; trail = []; particles = []; popups = []; }

  // ============================================================
  // INPUT
  // ============================================================
  function toCanvas(ev){ const r = c.getBoundingClientRect(); const t = ev.touches ? ev.touches[0] : ev; return { x:(t.clientX - r.left) * (W / r.width), y:(t.clientY - r.top) * (H / r.height) }; }
  const BTN_START = { x: W/2 - 100, y: 380, w: 200, h: 50 };
  const BTN_AGAIN = { x: W/2 - 100, y: 420, w: 200, h: 50 };
  const BTN_MENU  = { x: W/2 - 100, y: 485, w: 200, h: 36 };
  function inZ(z, x, y){ return x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h; }
  function handlePointerDown(x, y){ initAudio(); if (actx && actx.state === 'suspended') actx.resume(); if (mode === 'menu'){ if (inZ(BTN_START, x, y)) newGame(); return; } if (mode === 'gameover'){ if (inZ(BTN_AGAIN, x, y)) newGame(); else if (inZ(BTN_MENU, x, y)) backToMenu(); return; } if (mode === 'playing'){ if (x < W/2){ flipperL.pressed = true; sfx.flipper(); } else { flipperR.pressed = true; sfx.flipper(); } } }
  function handlePointerUp(){ flipperL.pressed = false; flipperR.pressed = false; }
  c.addEventListener('pointerdown', ev => { ev.preventDefault(); const p = toCanvas(ev); handlePointerDown(p.x, p.y); }, { passive:false });
  c.addEventListener('pointerup', ev => { ev.preventDefault(); handlePointerUp(); }, { passive:false });
  c.addEventListener('pointercancel', handlePointerUp, { passive:false });
  c.addEventListener('pointerleave', handlePointerUp, { passive:false });
  addEventListener('keydown', ev => { if (ev.key === ' ' || ev.key === 'Enter'){ initAudio(); if (actx && actx.state === 'suspended') actx.resume(); if (mode === 'menu') newGame(); else if (mode === 'gameover') newGame(); ev.preventDefault(); } if (ev.key === 'a' || ev.key === 'A' || ev.key === 'ArrowLeft'){ if (mode === 'playing' && !flipperL.pressed){ flipperL.pressed = true; sfx.flipper(); } } if (ev.key === 'd' || ev.key === 'D' || ev.key === 'ArrowRight'){ if (mode === 'playing' && !flipperR.pressed){ flipperR.pressed = true; sfx.flipper(); } } });
  addEventListener('keyup', ev => { if (ev.key === 'a' || ev.key === 'A' || ev.key === 'ArrowLeft') flipperL.pressed = false; if (ev.key === 'd' || ev.key === 'D' || ev.key === 'ArrowRight') flipperR.pressed = false; });

  // ============================================================
  // DRAW
  // ============================================================
  function drawTable(){ const grd = g.createLinearGradient(0, TOP_Y, 0, H); grd.addColorStop(0, '#2a0a50'); grd.addColorStop(0.5, '#4a1080'); grd.addColorStop(1, '#1a0530'); g.fillStyle = grd; g.fillRect(WALL_L_X, TOP_Y, WALL_R_X - WALL_L_X, 520); g.save(); g.beginPath(); g.rect(WALL_L_X, TOP_Y, WALL_R_X - WALL_L_X, 520); g.clip(); for (let i = 0; i < 6; i++){ g.strokeStyle = `hsla(${(i*60 + frame*0.4) % 360}, 95%, 60%, 0.18)`; g.lineWidth = 8; g.beginPath(); for (let t = 0; t <= 1; t += 0.05){ const yy = 100 + i * 90 + Math.sin(t * Math.PI * 2 + i) * 18; const xx = WALL_L_X + t * (WALL_R_X - WALL_L_X); if (t === 0) g.moveTo(xx, yy); else g.lineTo(xx, yy); } g.stroke(); } for (let i = 0; i < 20; i++){ const sx = 30 + (i * 73) % 340; const sy = 100 + (i * 47) % 440; const tw = 0.4 + 0.6 * Math.abs(Math.sin(frame * 0.05 + i)); g.fillStyle = `rgba(255,255,255,${tw * 0.6})`; g.beginPath(); g.arc(sx, sy, 1.2, 0, 7); g.fill(); } g.restore(); g.strokeStyle = '#ffd700'; g.lineWidth = 3; g.strokeRect(WALL_L_X, TOP_Y, WALL_R_X - WALL_L_X, 520); g.strokeStyle = 'rgba(255, 200, 100, 0.4)'; g.lineWidth = 1; g.strokeRect(WALL_L_X + 2, TOP_Y + 2, WALL_R_X - WALL_L_X - 4, 516); g.strokeStyle = '#ff80c0'; g.lineWidth = 4; g.beginPath(); g.moveTo(WALL_L_X, TOP_Y); g.lineTo(WALL_L_X, 520); g.lineTo(138, 540); g.moveTo(WALL_R_X, TOP_Y); g.lineTo(WALL_R_X, 520); g.lineTo(262, 540); g.moveTo(WALL_L_X, TOP_Y); g.lineTo(WALL_R_X, TOP_Y); g.stroke(); }
  function drawBumpers(){ for (const b of BUMPERS){ const pulse = 0.5 + 0.5 * Math.sin(frame * 0.08 + b.x * 0.1); g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = b.color + '55'; g.beginPath(); g.arc(b.x, b.y, b.r + 8 + pulse * 4, 0, 7); g.fill(); g.fillStyle = b.color + '22'; g.beginPath(); g.arc(b.x, b.y, b.r + 16 + pulse * 6, 0, 7); g.fill(); g.restore(); const grd = g.createRadialGradient(b.x - b.r*0.3, b.y - b.r*0.3, b.r*0.1, b.x, b.y, b.r); grd.addColorStop(0, b.glow); grd.addColorStop(0.6, b.color); grd.addColorStop(1, '#1a0530'); g.fillStyle = grd; g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.fill(); g.strokeStyle = '#ffd700'; g.lineWidth = 2.5; g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.stroke(); g.strokeStyle = 'rgba(255,255,255,0.6)'; g.lineWidth = 1; g.beginPath(); g.arc(b.x, b.y, b.r - 2, 0, 7); g.stroke(); emoji(b.emoji, b.x, b.y, b.r * 1.35, false); } }
  function drawPosts(){ for (const p of POSTS){ g.fillStyle = '#c060a0'; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); g.strokeStyle = '#ffd700'; g.lineWidth = 1.5; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.stroke(); g.fillStyle = 'rgba(255,255,255,0.8)'; g.beginPath(); g.arc(p.x - 1, p.y - 1, 1.5, 0, 7); g.fill(); } }
  function drawFlippers(){ for (const f of [flipperL, flipperR]){ const tipX = f.px + Math.cos(f.angle) * f.len; const tipY = f.py + Math.sin(f.angle) * f.len; if (f.pressed){ g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = 'rgba(255, 100, 200, 0.35)'; g.beginPath(); g.arc(f.px, f.py, 28, 0, 7); g.fill(); g.restore(); } g.lineCap = 'round'; g.strokeStyle = '#a02080'; g.lineWidth = f.w + 4; g.beginPath(); g.moveTo(f.px, f.py); g.lineTo(tipX, tipY); g.stroke(); g.strokeStyle = f.pressed ? '#ff80d0' : '#ff40a0'; g.lineWidth = f.w; g.beginPath(); g.moveTo(f.px, f.py); g.lineTo(tipX, tipY); g.stroke(); g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(f.px + Math.cos(f.angle - 0.15) * 6, f.py + Math.sin(f.angle - 0.15) * 6); g.lineTo(tipX - Math.cos(f.angle - 0.15) * 4, tipY - Math.sin(f.angle - 0.15) * 4); g.stroke(); g.fillStyle = '#ffd700'; g.beginPath(); g.arc(f.px, f.py, 5, 0, 7); g.fill(); g.strokeStyle = '#7a5200'; g.lineWidth = 1.5; g.beginPath(); g.arc(f.px, f.py, 5, 0, 7); g.stroke(); g.fillStyle = '#fff'; g.beginPath(); g.arc(f.px - 1, f.py - 1, 1.5, 0, 7); g.fill(); } g.lineCap = 'butt'; }
  function drawTrail(){ for (const t of trail){ const a = Math.min(1, t.life / 22) * 0.7; g.globalAlpha = a * 0.5; g.fillStyle = `hsl(${t.hue}, 95%, 60%)`; g.beginPath(); g.arc(t.x, t.y, BALL_R * 1.6, 0, 7); g.fill(); g.globalAlpha = a; g.fillStyle = `hsl(${t.hue}, 95%, 72%)`; g.beginPath(); g.arc(t.x, t.y, BALL_R * 0.9, 0, 7); g.fill(); } g.globalAlpha = 1; }
  function drawBall(){ if (!ball.alive) return; g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = 'rgba(255,255,255,0.35)'; g.beginPath(); g.arc(ball.x, ball.y, BALL_R * 2, 0, 7); g.fill(); g.restore(); const grd = g.createRadialGradient(ball.x - 3, ball.y - 3, 1, ball.x, ball.y, BALL_R); grd.addColorStop(0, '#ffffff'); grd.addColorStop(0.4, '#e0e0f0'); grd.addColorStop(1, '#6060a0'); g.fillStyle = grd; g.beginPath(); g.arc(ball.x, ball.y, BALL_R, 0, 7); g.fill(); g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 1; g.beginPath(); g.arc(ball.x, ball.y, BALL_R, 0, 7); g.stroke(); g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.arc(ball.x - 3, ball.y - 3, 2.2, 0, 7); g.fill(); }
  function drawParticles(){ for (const p of particles){ g.globalAlpha = Math.min(1, p.life / 20); g.fillStyle = p.color; g.beginPath(); g.arc(p.x, p.y, p.size, 0, 7); g.fill(); } g.globalAlpha = 1; }
  function drawPopups(){ for (const p of popups){ g.globalAlpha = Math.min(1, p.life / 25); g.font = 'bold ' + p.size + 'px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = 'rgba(0,0,0,0.75)'; g.fillText(p.text, p.x + 2, p.y + 2); g.fillStyle = p.color; g.fillText(p.text, p.x, p.y); } g.globalAlpha = 1; }
  function drawHUD(){ g.fillStyle = 'rgba(0,0,0,0.78)'; g.fillRect(0, 0, W, 72); g.strokeStyle = '#ffd700'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, 72); g.lineTo(W, 72); g.stroke(); emoji('💰', 24, 22, 18, false); txt(credits + 'c', 40, 22, 14, '#ffd700', 'left'); txt('SCORE', W/2, 12, 9, '#c8a870', 'center'); txt(score.toLocaleString('en-US'), W/2, 36, 22, '#fff', 'center'); txt('BALLS', W - 60, 14, 8, '#c8a870', 'center'); for (let i = 0; i < 3; i++){ const bx = W - 82 + i * 15; const on = i < ballsLeft; g.fillStyle = on ? '#ff40a0' : 'rgba(80,40,80,0.5)'; g.beginPath(); g.arc(bx, 34, 5, 0, 7); g.fill(); g.strokeStyle = on ? '#ffd700' : '#3a2030'; g.lineWidth = 1.5; g.beginPath(); g.arc(bx, 34, 5, 0, 7); g.stroke(); } if (combo > 1 && comboTimer > 0){ const alpha = Math.min(1, comboTimer / 30); g.globalAlpha = alpha; txt('x' + combo + ' COMBO', W/2, 60, 11, '#ff80d0', 'center'); g.globalAlpha = 1; } txt('BEST ' + best.toLocaleString('en-US'), 12, 60, 9, '#ffd700', 'left'); }
  function drawMenu(){ g.fillStyle = 'rgba(10, 2, 20, 0.78)'; g.fillRect(0, 0, W, H); emoji('🦄', W/2, 120, 90, true); const title = 'UNICORN', title2 = 'PINBALL'; const charW = 24; const sx1 = W/2 - (title.length * charW) / 2 + charW / 2; for (let i = 0; i < title.length; i++){ const hue = (frame * 2 + i * 40) % 360; g.font = 'bold 32px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = 'rgba(0,0,0,0.7)'; g.fillText(title[i], sx1 + i * charW + 2, 212); g.fillStyle = `hsl(${hue}, 100%, 70%)`; g.fillText(title[i], sx1 + i * charW, 210); } const sx2 = W/2 - (title2.length * charW) / 2 + charW / 2; for (let i = 0; i < title2.length; i++){ const hue = (frame * 2 + i * 40 + 180) % 360; g.font = 'bold 32px sans-serif'; g.fillStyle = 'rgba(0,0,0,0.7)'; g.fillText(title2[i], sx2 + i * charW + 2, 248); g.fillStyle = `hsl(${hue}, 100%, 70%)`; g.fillText(title2[i], sx2 + i * charW, 246); } txt('Tap left / right = flippers', W/2, 300, 12, '#c8a8e8', 'center'); txt('10 credits per game · 3 balls', W/2, 320, 11, '#c8a8e8', 'center'); txt('Every 1000 points = 1 bonus credit', W/2, 340, 11, '#8affd0', 'center'); txt('BEST: ' + best.toLocaleString('en-US'), W/2, 362, 11, '#ffd700', 'center'); const z = BTN_START; const pulse = 0.5 + 0.5 * Math.sin(frame * 0.1); g.save(); if (credits >= 10){ g.shadowColor = '#ffd700'; g.shadowBlur = 20 + pulse * 10; } const btnGrd = g.createLinearGradient(z.x, z.y, z.x, z.y + z.h); if (credits >= 10){ btnGrd.addColorStop(0, '#ff5aa0'); btnGrd.addColorStop(1, '#c02080'); } else { btnGrd.addColorStop(0, '#3a2a4a'); btnGrd.addColorStop(1, '#2a1a30'); } g.fillStyle = btnGrd; roundRect(z.x, z.y, z.w, z.h, 10); g.fill(); g.strokeStyle = credits >= 10 ? '#ffd700' : '#4a3a50'; g.lineWidth = 3; roundRect(z.x, z.y, z.w, z.h, 10); g.stroke(); g.restore(); txt('PLAY · 10c', W/2, z.y + z.h / 2, 18, credits >= 10 ? '#fff' : '#666', 'center'); }
  function drawGameOver(){ g.fillStyle = 'rgba(10, 2, 20, 0.85)'; g.fillRect(0, 0, W, H); emoji('💀', W/2, 130, 70, false); txt('GAME OVER', W/2, 190, 28, '#ff5050', 'center'); txt('SCORE', W/2, 240, 12, '#c8a870', 'center'); txt(score.toLocaleString('en-US'), W/2, 270, 26, '#fff', 'center'); const earned = Math.floor(score / 1000); txt('PRIZE', W/2, 310, 12, '#c8a870', 'center'); txt('+' + earned + ' credits', W/2, 335, 20, '#8f8', 'center'); if (score > 0 && score === best) txt('NEW RECORD!', W/2, 365, 14, '#ffd700', 'center'); txt('Total: ' + credits + 'c', W/2, 390, 14, '#ffd700', 'center'); const z = BTN_AGAIN; const pulse = 0.5 + 0.5 * Math.sin(frame * 0.1); g.save(); if (credits >= 10){ g.shadowColor = '#ffd700'; g.shadowBlur = 15 + pulse * 10; } const btnGrd = g.createLinearGradient(z.x, z.y, z.x, z.y + z.h); if (credits >= 10){ btnGrd.addColorStop(0, '#ff5aa0'); btnGrd.addColorStop(1, '#c02080'); } else { btnGrd.addColorStop(0, '#3a2a4a'); btnGrd.addColorStop(1, '#2a1a30'); } g.fillStyle = btnGrd; roundRect(z.x, z.y, z.w, z.h, 10); g.fill(); g.strokeStyle = credits >= 10 ? '#ffd700' : '#4a3a50'; g.lineWidth = 3; roundRect(z.x, z.y, z.w, z.h, 10); g.stroke(); g.restore(); txt('RETRY · 10c', W/2, z.y + z.h / 2, 16, credits >= 10 ? '#fff' : '#666', 'center'); const z2 = BTN_MENU; g.fillStyle = '#2a1a30'; roundRect(z2.x, z2.y, z2.w, z2.h, 8); g.fill(); g.strokeStyle = '#5a4a6a'; g.lineWidth = 2; roundRect(z2.x, z2.y, z2.w, z2.h, 8); g.stroke(); txt('MENU', W/2, z2.y + z2.h / 2, 12, '#aaa', 'center'); }

  // ============================================================
  // LOOP
  // ============================================================
  function update(){ const now = performance.now(); const frameDt = Math.min(0.05, (now - lastFrame) / 1000); lastFrame = now; frame++; if (shake > 0) shake *= 0.88; if (flash > 0) flash--; if (comboTimer > 0){ comboTimer -= frameDt * 60; if (comboTimer <= 0){ combo = 1; comboTimer = 0; } } const targetI = mode === 'playing' ? Math.min(1, score / 8000) : 0.15; musicIntensity += (targetI - musicIntensity) * frameDt * 2; updateFlipper(flipperL, frameDt); updateFlipper(flipperR, frameDt); if (mode === 'playing' && ball.alive){ accum += frameDt; if (accum > MAX_ACCUM) accum = MAX_ACCUM; while (accum >= PHYS_DT){ physicsStep(PHYS_DT); accum -= PHYS_DT; } } for (let i = trail.length - 1; i >= 0; i--){ trail[i].life -= frameDt * 30; if (trail[i].life <= 0) trail.splice(i, 1); } for (let i = particles.length - 1; i >= 0; i--){ const p = particles[i]; p.x += p.vx * frameDt; p.y += p.vy * frameDt; p.vy += 300 * frameDt; p.vx *= Math.pow(0.95, frameDt * 60); p.vy *= Math.pow(0.95, frameDt * 60); p.life -= frameDt * 60; if (p.life <= 0) particles.splice(i, 1); } for (let i = popups.length - 1; i >= 0; i--){ const p = popups[i]; p.y += p.vy * frameDt; p.life -= frameDt * 60; if (p.life <= 0) popups.splice(i, 1); } }
  function draw(){ g.fillStyle = '#0a0218'; g.fillRect(0, 0, W, H); g.save(); if (shake > 0.3) g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); drawTable(); drawBumpers(); drawPosts(); drawFlippers(); if (mode === 'playing' || mode === 'gameover'){ drawTrail(); drawBall(); } drawParticles(); drawPopups(); g.restore(); if (mode === 'playing' || mode === 'gameover') drawHUD(); if (mode === 'menu') drawMenu(); if (mode === 'gameover') drawGameOver(); if (flash > 0){ g.fillStyle = `rgba(255,255,255,${flash / 20 * 0.6})`; g.fillRect(0, 0, W, H); } const vg = g.createRadialGradient(W/2, H/2, 150, W/2, H/2, W * 0.75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)'); g.fillStyle = vg; g.fillRect(0, 0, W, H); }
  function loop(){ update(); draw(); requestAnimationFrame(loop); }
  loop();
})();
